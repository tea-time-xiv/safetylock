name: Build SafetyLockPlugin

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

# Read-only by default: a pull request build has no business writing to the repo.
# Only the release job, which never runs for a pull request, is granted write.
permissions:
  contents: read

jobs:

  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    outputs:
      version: ${{ steps.version.outputs.version }}
      skip_release: ${{ steps.tag.outputs.skip }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Read version from csproj
      id: version
      run: |
        $version = ([xml](Get-Content "SafetyLockPlugin/SafetyLockPlugin.csproj")).Project.PropertyGroup.Version
        "VERSION=$version" >> $env:GITHUB_ENV
        "version=$version" >> $env:GITHUB_OUTPUT

    - name: Check if release tag exists
      id: tag
      run: |
        git fetch --tags
        $tag = "v$env:VERSION"
        $exists = git tag -l $tag
        $skip = if ($exists) { "true" } else { "false" }
        "skip=$skip" >> $env:GITHUB_OUTPUT

    - name: Install .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build --configuration Release

    - name: Package plugin
      run: |
        Push-Location ".\SafetyLockPlugin\bin\x64\Release"
        Compress-Archive -Path "SafetyLockPlugin.dll", "SafetyLockPlugin.json", "images" -DestinationPath "$env:GITHUB_WORKSPACE\SafetyLockPlugin.zip"
        Pop-Location

    # Runs for pull requests too, so a version bump without a changelog entry fails
    # before it is merged rather than at release time.
    - name: Extract release notes
      run: |
        $ErrorActionPreference = "Stop"

        # The same section ends up in the in-game changelog, via the plugin repo generator.
        $changelog = Get-Content "CHANGELOG.md" -Raw
        $pattern = "(?ms)^##\s+\[?" + [regex]::Escape($env:VERSION) + "\]?(?![\d.])[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
        $match = [regex]::Match($changelog, $pattern)
        if (-not $match.Success -or -not $match.Groups[1].Value.Trim()) {
            throw "CHANGELOG.md has no section for $env:VERSION. Add one before releasing."
        }
        Set-Content "notes.md" $match.Groups[1].Value.Trim() -Encoding utf8NoBOM

    - name: Store artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SafetyLockPlugin
        path: |
          SafetyLockPlugin.zip
          notes.md
        if-no-files-found: error
        retention-days: 1

  release:
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.skip_release == 'false'
    runs-on: ubuntu-latest

    # The only job in this repo that may write, and it cannot run for a pull request.
    permissions:
      contents: write

    steps:
    - name: Download build output
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: SafetyLockPlugin

    - name: Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        # The release job does not check the repo out, so the action needs to be told
        # which commit to hang the new tag on.
        commit: ${{ github.sha }}
        artifacts: "SafetyLockPlugin.zip"
        tag: v${{ needs.build.outputs.version }}
        name: Safety Lock v${{ needs.build.outputs.version }}
        bodyFile: notes.md
        token: ${{ secrets.GITHUB_TOKEN }}

    # The Tea Time plugin repo builds pluginmaster.json itself, from this repo's latest
    # release and the manifest inside its zip. It holds no credential for this repo and
    # this repo holds none for it: its schedule picks the release up within 15 minutes,
    # or run its "Publish pluginmaster" workflow by hand to publish at once.
